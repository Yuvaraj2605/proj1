<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Login & Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <!-- Sign in Form Starts -->
            <div class="face front">
                <div class="header">
                    <h2>NexusFlow</h2>
                    <p>Visual IoT Telemetry Platform</p>
                </div>
                <div class="inputs">
                    <input type="email" id="email" placeholder="Email Address">
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button class="submit" id="loginBtn">Sign in</button>
                <div class="footer">
                    Don't have an account? <span onclick="flip()">Join now</span>
                </div>
            </div>

            <!-- Sign up Form Starts -->
            <div class="face back">
                
                <div class="header">
                    <h2>Create Account</h2>
                    <p>Start your IoT journey here</p>
                </div>
                <div class="inputs">
                    <input type="text" id="fullName" placeholder="Full name">
                    <input type="email" id="signupEmail" placeholder="Enter email">
                    <input type="password" id="signupPassword" placeholder="Create password">
                </div>
                <button class="submit"id="signupBtn">Sign Up</button>
                <div class="footer">
                    Already a member? <span onclick="flip()">Log in</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function flip(){
            document.getElementById('card').classList.toggle('flipped');


        }
    </script>
    <script src="index.js"></script>
</body>
</html>
